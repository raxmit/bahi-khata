services:
  mysql:
    image: mysql:8.0
    container_name: pftracker-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: pftracker
      MYSQL_USER: pfuser
      MYSQL_PASSWORD: pfpass
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pftracker-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: mysql://pfuser:pfpass@mysql:3306/pftracker
      PORT: 3000
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:4200
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pftracker-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: ng serve --host 0.0.0.0 --poll 2000 --proxy-config proxy.docker.conf.json

volumes:
  mysql_data:
