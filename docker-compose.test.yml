services:
  mysql-test:
    image: mysql:8.0
    container_name: pftracker-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: test_only_root_password
      MYSQL_DATABASE: pftracker_test
      MYSQL_USER: pfuser
      MYSQL_PASSWORD: test_only_pf_password
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
