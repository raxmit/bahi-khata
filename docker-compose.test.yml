version: '3.9'

services:
  mysql-test:
    image: mysql:8.0
    container_name: pftracker-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: pftracker_test
      MYSQL_USER: pfuser
      MYSQL_PASSWORD: pfpass
    ports:
      - "3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
